function updateCountdown(){const box=$('#countdown');if(!box)return;const left=Math.max(0,(S.status.nextAllowedAt||0)-Date.now());box.textContent=left?'下次可更新 · '+Math.ceil(left/60000)+' 分钟后'+(S.status.pending?' · 有新邮件待合并':''):(S.status.busy?'正在读取并分析，请稍候':S.status.manualRetry?'自动更新已暂停，请手动重试':S.state.settings.autoSummary?'新邮件出现后更新；应用需保持运行':'自动总结已关闭；可手动更新');const b=$('[data-generate]');if(b&&S.report)b.disabled=!!S.status.busy||left>0;}

function mailboxPage(){const account=S.state.accounts.find(a=>a.id===S.account);$('#workspace').innerHTML='<div class="mailbox '+(S.selected?'has-selection':'')+'"><aside class="folders"><select id="accountSelect" aria-label="选择邮箱">'+S.state.accounts.map(a=>'<option value="'+e(a.id)+'" '+(a.id===S.account?'selected':'')+'>'+e(a.name)+'</option>').join('')+'</select><select class="compact-folder" id="folderSelect" aria-label="选择文件夹">'+S.folders.map(f=>'<option value="'+e(f.path)+'" '+(f.path===S.folder?'selected':'')+'>'+e(f.path==='INBOX'?'收件箱':f.name)+'</option>').join('')+'</select><div class="section-label" style="margin-left:8px">邮箱文件夹</div><div id="folderList">'+S.folders.map(f=>'<button class="folder '+(f.path===S.folder?'active':'')+'" data-folder="'+e(f.path)+'">'+e(({INBOX:'收件箱',Sent:'已发送',Drafts:'草稿箱',Trash:'已删除',Junk:'垃圾邮件'})[f.path]||f.name)+'</button>').join('')+'</div><div class="side-note">只读查看<br>'+e(account?.email||'')+'</div></aside><section class="message-list"><div class="list-toolbar"><b>'+e(S.page==='unread'?'未读邮件':({INBOX:'收件箱',Sent:'已发送',Drafts:'草稿箱',Trash:'已删除',Junk:'垃圾邮件'})[S.folder]||S.folder)+'</b><button class="ghost small" data-refresh-mail="1">刷新</button></div><div id="mailRows">'+rowsHTML()+'</div></section><div id="mailResize" class="mail-resize" role="separator" tabindex="0" aria-label="调整邮件列表宽度" aria-orientation="vertical"></div><section id="mailDetail" class="mail-detail">'+(S.selected?detailHTML(S.selected):'<div class="empty" style="border:0"><div style="font-size:34px">✉</div><h2>选择一封邮件</h2><p>列表保持可见，右侧阅读原文。阅读不会标记已读。</p></div>')+'</section></div>';X.resizeMounted();}
function rowsHTML(){if(!S.state.accounts.length)return '<div class="loader">请先添加邮箱账号。<br><button data-settings="1">添加账号</button></div>';if(!S.messages.length)return '<div class="loader">暂无邮件或正在读取…</div>';let html=S.messages.map(m=>'<button class="mail-row '+(S.selected?.id===m.id?'selected':'')+'" data-mail="'+e(m.id)+'"><div class="sender-row">'+(!m.read?'<span class="unread-dot"></span>':'')+'<span class="sender">'+e(m.from.replace(/<.*>/,'').trim()||m.from)+'</span><span class="when">'+e(m.date.slice(0,10)===S.state.today?time(m.date):m.date.slice(5,10))+'</span></div><div class="subject">'+e(m.subject)+'</div><div class="preview">'+(m.attachments.length?'⌕ '+m.attachments.length+' 个附件 · ':'')+e(m.to)+'</div></button>').join('');if(S.cursor)html+='<button style="margin:15px" data-more="1">加载更多</button>';return html;}

async function loadMail(append=false,force=false){if(!S.account)return;const revision=++S.revision,key=[S.account,S.folder,S.query,S.page==='unread',JSON.stringify(S.advanced)].join('|');const params={accountId:S.account,folder:S.folder,query:S.query,unread:String(S.page==='unread'),cursor:append?S.cursor||'':'',...S.advanced,hasAttachment:String(!!S.advanced.hasAttachment)};const apply=r=>{S.messages=append?[...new Map([...S.messages,...r.messages].map(m=>[m.id,m])).values()]:r.messages;S.cursor=r.nextCursor;S.listCache.set(key,{messages:S.messages,nextCursor:S.cursor,updatedAt:Date.now()});$('#mailRows').innerHTML=S.messages.length?rowsHTML():'<div class="loader">没有符合条件的邮件。</div>';};try{if(!append){S.messages=[];S.cursor=null;const memory=S.listCache.get(key);if(memory)apply(memory);else{const cached=await api('/cached?'+new URLSearchParams({...params,command:'list'}));if(revision!==S.revision)return;if(cached?.data)apply(cached.data);else $('#mailRows').innerHTML='<div class="loader" role="status">首次读取邮件…</div>';}}const r=await api('/messages?'+new URLSearchParams({...params,force:String(force)}));if(revision!==S.revision||!['mail','unread'].includes(S.page))return;apply(r);if(r.failed?.length)toast('部分邮件无法读取，请刷新重试');}catch(err){if(revision!==S.revision)return;if(S.messages.length)toast('已保留缓存邮件；'+err.message);else if($('#mailRows'))$('#mailRows').innerHTML='<div class="loader">'+e(err.message)+'</div>';}}

async function saveCompose(){
 if(S.draftPromise){await S.draftPromise;if(S.page!=='compose'||!$('#composeForm'))return S.compose;return saveCompose();}
 const clean=d=>JSON.stringify(Object.fromEntries(Object.entries(draftPayload(d)).filter(([k])=>!['id','revision','createdAt','updatedAt'].includes(k))));
 S.draftPromise=(async()=>{let saved;for(let round=0;round<10;round++){const d=readCompose(),fingerprint=clean(d);saved=await api('/draft',draftPayload(d));if(S.page!=='compose'||!$('#composeForm')){S.compose=saved;return saved;}const current=readCompose();S.compose={...current,id:saved.id,revision:saved.revision,createdAt:saved.createdAt,updatedAt:saved.updatedAt};if(clean(current)===fingerprint){if($('#draftStatus'))$('#draftStatus').textContent='已自动保存 · '+time(saved.updatedAt);return saved;}}if($('#draftStatus'))$('#draftStatus').textContent='持续编辑中，将继续自动保存';return saved;})().catch(err=>{if($('#draftStatus'))$('#draftStatus').textContent=draftSaveError(err.message);throw err;}).finally(()=>S.draftPromise=null);return S.draftPromise;
}
function emailsOf(text){return [...String(text||'').matchAll(/[A-Za-z0-9.!#$%&'*+\-/=?^_`{|}~]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g)].map(m=>m[0]);}
async function newCompose(mode='new',mail=null){if(S.uploading)throw new Error('请等待附件添加完成');if(!S.state.accounts.length){toast('请先保存邮箱账号');await openSettings();return;}if(S.page==='compose'&&$('#composeForm'))await saveCompose();const accountId=mail?.accountId||S.account||S.state.accounts[0].id,account=S.state.accounts.find(a=>a.id===accountId)||S.state.accounts[0];let d={accountId:account.id,to:'',cc:'',bcc:'',subject:'',text:'',inReplyTo:'',references:''};if(mail){const reply=mode==='reply'||mode==='reply-all',sender=emailsOf(mail.replyTo||mail.from);d.to=reply?sender.join('; '):'';if(mode==='reply-all'){const own=account.email.toLowerCase();d.to=[...new Set([...sender,...emailsOf(mail.to)])].filter(x=>x.toLowerCase()!==own).join('; ');d.cc=[...new Set(emailsOf(mail.cc))].filter(x=>x.toLowerCase()!==own&&!emailsOf(d.to).some(t=>t.toLowerCase()===x.toLowerCase())).join('; ');}d.subject=reply?(/^(Re|回复)[:：]/i.test(mail.subject)?mail.subject:'Re: '+mail.subject):'Fwd: '+mail.subject;Object.assign(d,quoteFromMail(mail,mode));if(reply){d.inReplyTo=(String(mail.messageId||'').match(/<[^<>\s]+>/)||[])[0]||'';d.references=[...String(mail.references||'').matchAll(/<[^<>\s]+>/g)].map(m=>m[0]).concat(d.inReplyTo||[]).slice(-30).join(' ');}}S.compose=d;S.prepared=null;composePage();}
